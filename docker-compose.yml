services:
  postgres:
    image: postgres:16-alpine
    container_name: ct-modular-postgres
    environment:
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct_dev_password
      POSTGRES_DB: ct_modular
    ports:
      - "5432:5432"
    volumes:
      - ct_pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d ct_modular"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ct_pg_data:
