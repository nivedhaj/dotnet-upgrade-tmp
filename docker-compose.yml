services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct_dev_password
      POSTGRES_DB: ct_modular
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d ct_modular"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=ct_modular;Username=ct;Password=ct_dev_password"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
