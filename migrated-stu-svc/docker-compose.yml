services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ctstu
      POSTGRES_USER: ctstu
      POSTGRES_PASSWORD: ctstu
    ports:
      - "5432:5432"
    volumes:
      - ctstu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctstu -d ctstu"]
      interval: 5s
      timeout: 5s
      retries: 20

  ct.stu:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5190
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ctstu;Username=ctstu;Password=ctstu
    ports:
      - "5190:5190"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ctstu-postgres:
