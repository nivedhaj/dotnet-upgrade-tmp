services:
  postgres:
    image: postgres:17
    container_name: ct-postgres
    environment:
      POSTGRES_DB: ct
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ct_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d ct"]
      interval: 5s
      timeout: 5s
      retries: 10

  ct:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ct-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=ct;Username=ct;Password=ct_dev_password"
    ports:
      - "8080:8080"

volumes:
  ct_postgres_data:
