version: '3.8'

services:
  ct-stu:
    build:
      context: .
      dockerfile: ./Dockerfile-shared
      args:
        CT_ENV: Test
    environment:
      CT_ENV: Test
      ASPNETCORE_ENVIRONMENT: Test
    volumes:
      - ./config/appsettings.Test.json:/ct-stu/appsettings.Test.json
      - ./certs/free.btl.client.certificate.pfx:/ct-stu/free.btl.client.certificate.pfx
    ports:
      - "5190:5190"
    image: ct-stu-image:latest
    restart: unless-stopped
    networks:
      - ct-network

networks:
  ct-network:
    external: true
