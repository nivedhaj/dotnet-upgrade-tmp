services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campustrack
      POSTGRES_USER: campustrack
      POSTGRES_PASSWORD: campustrack
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campustrack -d campustrack"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      Postgres__ConnectionString: Host=postgres;Port=5432;Database=campustrack;Username=campustrack;Password=campustrack
    ports: ["8080:8080"]
volumes:
  pgdata:
